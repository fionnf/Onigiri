[project]
name = "onigiri"
version = "0.1.0"
description = "Personal recipe bank: capture recipes from Instagram, the web and photos."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "openai>=1.57",
    "arq>=0.26",
    "redis>=5.2",
    "boto3>=1.35",
    "pillow>=11.0",
    "numpy>=2.1",
    "recipe-scrapers>=15.3",
    "trafilatura>=2.0",
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onigiri"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",     # FastAPI states dependencies as argument defaults, by design.
    "RUF012",   # SQLAlchemy and Pydantic class attributes are not ClassVar.
    "ASYNC109", # Timeouts here are handed to httpx and ffmpeg, which enforce them.
    "RUF001",   # En dashes and fraction glyphs are deliberate in recipe text.
    "UP042",    # SQLAlchemy maps (str, Enum) members by value; StrEnum changes str().
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]
